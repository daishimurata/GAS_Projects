    <script>
        let rateData = null;

        // Initialize rates from server
        window.onload = function () {
            google.script.run
                .withSuccessHandler(data => {
                    rateData = data;
                    console.log("Rates loaded", data);
                })
                .getShippingRates();
        };

        function estimateFromUrl() {
            const url = document.getElementById('product-url').value;
            if (!url) {
                alert("商品ページのURLを入力してください。");
                return;
            }

            const btn = document.getElementById('btn-estimate');
            btn.disabled = true;
            btn.innerText = "推測中...";

            google.script.run
                .withSuccessHandler(result => {
                    btn.disabled = false;
                    btn.innerText = "自動取得";
                    if (result) {
                        if (result.title_jp) document.getElementById('title-input').value = result.title_jp;
                        if (result.price_jpy) document.getElementById('price-input').value = result.price_jpy;

                        document.getElementById('weight-input').value = result.weight || '';
                        document.getElementById('length-input').value = result.length || '';
                        document.getElementById('width-input').value = result.width || '';
                        document.getElementById('height-input').value = result.height || '';
                        calculate();
                        alert("AIが商品情報とサイズを推測しました！\n数値を調整の上「利益・送料を計算」を押してください。");
                    } else {
                        alert("解析に失敗しました。URLを確認してください。");
                    }
                })
                .withFailureHandler(err => {
                    btn.disabled = false;
                    btn.innerText = "自動取得";
                    alert("エラー: " + err.message);
                })
                .estimateProductSize(url);
        }

        function calculate() {
            if (!rateData) {
                alert("データの読み込み中です。少々お待ちください。");
                return;
            }

            const weight = parseFloat(document.getElementById('weight-input').value) || 0;
            const length = parseFloat(document.getElementById('length-input').value) || 0;
            const width = parseFloat(document.getElementById('width-input').value) || 0;
            const height = parseFloat(document.getElementById('height-input').value) || 0;

            const globalCountry = document.getElementById('country-global-select').value;

            // Map global country to DHL Zone for better accuracy
            const zoneMap = {
                'UK': 'Zone_8',
                'GERMANY': 'Zone_8',
                'FRANCE': 'Zone_8',
                'AUSTRALIA': 'Zone_9',
                'CANADA': 'Zone_9'
            };
            const globalDhlZone = zoneMap[globalCountry] || 'Zone_8';

            // Map global country to EMS Zone
            const emsZoneMap = {
                'UK': 'Zone_3',
                'GERMANY': 'Zone_3',
                'FRANCE': 'Zone_3',
                'AUSTRALIA': 'Zone_3',
                'CANADA': 'Zone_3'
            };
            const globalEmsZone = emsZoneMap[globalCountry] || 'Zone_3';

            // Targets
            renderZone('result-usa-body', 'USA_48', 'Zone_4', 'Zone_4', weight, length, width, height);
            renderZone('result-global-body', globalCountry, globalDhlZone, globalEmsZone, weight, length, width, height);
        }

        function renderZone(targetId, ocCountry, dhlZone, emsZone, weight, length, width, height) {
            const tbody = document.getElementById(targetId);
            tbody.innerHTML = '';

            // User Inputs for calculations
            const itemPriceJpy = parseFloat(document.getElementById('price-input').value) || 0;
            const exchangeRate = parseFloat(document.getElementById('exchange-rate').value) || 150;
            const ebayFeePct = parseFloat(document.getElementById('ebay-fee').value) || 15;
            const profitMarginPct = parseFloat(document.getElementById('profit-margin').value) || 20;

            const feeRateMultiplier = 1 - (ebayFeePct / 100);
            const targetProfitRate = 1 - (ebayFeePct / 100) - (profitMarginPct / 100);

            const services = [
                { name: 'Orange Connex Economy', key: 'orange_economy', div: 6000, country: ocCountry },
                { name: 'SpeedPAK Economy', key: 'speedpak_economy', div: 6000, country: ocCountry },
                { name: 'SpeedPAK DHL', key: 'speedpak_dhl', div: 5000, country: dhlZone },
                { name: 'EMS (日本郵便)', key: 'japan_post_ems', div: null, country: emsZone },
                { name: '国際eパケットライト', key: 'japan_post_epacket_light', div: null, country: emsZone },
                { name: '小形包装物 (航空便)', key: 'japan_post_small_packet_air', div: null, country: emsZone },
                { name: '国際小包 (航空便)', key: 'japan_post_parcel_air', div: null, country: emsZone },
                { name: 'FedEx (データ未登録)', key: 'fedex', div: 5000, country: 'USA' }
            ];

            services.forEach(svc => {
                let price = null;
                const rates = rateData[svc.key];

                // Div null means real weight only (e.g. EMS)
                const volWeight = svc.div ? ((length * width * height) / svc.div) : 0;
                const chargeableWeight = Math.max(weight, volWeight);

                if (rates) {
                    if (svc.key === 'speedpak_dhl') {
                        // DHL rates are structured as { "weight": { "Zone_X": price } }
                        const sortedWeightKeys = Object.keys(rates).sort((a, b) => Number(a) - Number(b));
                        const targetStrKey = sortedWeightKeys.find(k => Number(k) >= (chargeableWeight - 0.001));
                        if (targetStrKey && rates[targetStrKey] && rates[targetStrKey][svc.country]) {
                            price = rates[targetStrKey][svc.country];
                        }
                    } else {
                        // Economy rates are structured as { "Country": { "weight": price } }
                        if (rates[svc.country]) {
                            const countryRates = rates[svc.country];
                            const sortedWeightKeys = Object.keys(countryRates).sort((a, b) => Number(a) - Number(b));
                            const targetStrKey = sortedWeightKeys.find(k => Number(k) >= (chargeableWeight - 0.001));
                            if (targetStrKey) {
                                price = countryRates[targetStrKey];
                            }
                        }
                    }
                }

                // Calculator Logic
                let breakEvenUsd = '-';
                let recommendedUsd = '-';

                if (price) {
                    const totalCostJpy = itemPriceJpy + price; // 仕入価格 + 送料(円)
                    const totalCostUsd = totalCostJpy / exchangeRate;

                    // 損益分岐点: totalCostUsd / (1 - ebayFee)
                    const breakEvenPrice = totalCostUsd / feeRateMultiplier;
                    breakEvenUsd = `$${breakEvenPrice.toFixed(2)}`;

                    // 推奨販売価格: totalCostUsd / (1 - ebayFee - profitMargin)
                    if (targetProfitRate > 0) {
                        const recommendedPrice = totalCostUsd / targetProfitRate;
                        recommendedUsd = `<span class="font-black text-lg">$${recommendedPrice.toFixed(2)}</span>`;
                    } else {
                        recommendedUsd = '<span class="text-[9px] text-red-500 leading-tight">利益率設定が<br>高すぎます</span>';
                    }
                }

                const priceDisplay = price ? `¥${price.toLocaleString()}` : '<span class="text-xs text-gray-400">該当なし</span>';
                const isVolumetric = volWeight > weight;
                const volumetricHtml = isVolumetric ? '<br><span class="text-[9px] text-orange-500 font-normal">容積適用 (' + volWeight.toFixed(2) + 'kg)</span>' : '';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-[13px] text-[var(--text-main)]">
                        ${svc.name}
                        ${volumetricHtml}
                    </td>
                    <td class="px-4 py-4 text-right font-bold text-sm text-[var(--text-muted)]">${priceDisplay}</td>
                    <td class="px-4 py-4 text-right font-bold text-sm text-gray-400">${breakEvenUsd}</td>
                    <td class="px-4 py-4 text-right text-[var(--accent-pink)]">${recommendedUsd}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
